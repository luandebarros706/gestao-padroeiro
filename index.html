<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Indicadores GIF</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #262f45;
    }

    .powerbi-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #262f45;
    }

    .powerbi-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh + 42px);
      border: 0;
    }
    .lateral {
  position: fixed;
  top: 0;
  height: 100vh;
  width: max(0px, calc((100vw - 177.7778vh) / 2));
  background: #262f45;
  z-index: 999999;
  pointer-events: none;
}

.lateral-esquerda {
  left: 0;
}

.lateral-direita {
  right: 0;
}
  </style>
</head>

<body>

<div class="powerbi-container">
  <iframe
    class="powerbi-frame"
    title="Indicadores GIF"
    src="https://app.powerbi.com/reportEmbed?reportId=38622678-145b-4d52-a7a4-25c15d131de2&autoAuth=true&ctid=e2c81561-9925-44af-b8e5-942450c5786c"
    frameborder="0"
    allowfullscreen="true">
  </iframe>
</div>
<div class="lateral lateral-esquerda"></div>
<div class="lateral lateral-direita"></div>
</body>
</html>
