  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .powerbi-container {
      position: fixed;
      inset: 0;
      overflow: hidden;

    }

    .powerbi-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .barra-oculta {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 42px;
      background: #23304d;
      z-index: 999999;
    }
  </style>
</head>

<body>

  <div class="powerbi-container">
    <iframe
      class="powerbi-frame"
      title="Indicadores GIF"

      frameborder="0"

  </div>

  <div class="barra-oculta"></div>

</html>
